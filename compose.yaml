name: stridehub

# Linux VPS only: both services bind to loopback in the host network namespace.
# Host Nginx is the only public listener and the only trusted reverse proxy.
services:
  api:
    build:
      context: .
      target: api
    image: stridehub-api:local
    network_mode: host
    env_file:
      - path: ./deploy/.env.production
        format: raw
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "3002"
      DB_PATH: /data/stridehub.db
      TRUST_PROXY: loopback
    volumes:
      - /var/lib/stridehub/data:/data
      - /var/backups/stridehub:/backups
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      target: web
    image: stridehub-web:local
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8088/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
